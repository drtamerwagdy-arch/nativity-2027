<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>St. Mina App Portal</title>
<style>
:root{--red:#8e2226;--gold:#f6cb5c;--cream:#fff3d6;--navy:#0b1530;--paper:#f3efe7;--ink:#141010;--brown:#6d5e4f;--line:#ddd3c2;--card:#fff;--ok:#2e6b3a;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--navy);color:var(--cream);padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font:700 21px/1.15 Georgia,"Times New Roman",serif;margin:0;color:var(--gold);flex:1;min-width:0}
header .who{font-size:13px;opacity:.9}
.tier{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--gold);color:var(--navy);margin-left:6px;vertical-align:1px}
.tier.local{background:var(--cream)}
nav{background:var(--red);display:flex;overflow-x:auto;padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));-webkit-overflow-scrolling:touch}
nav button{all:unset;cursor:pointer;color:#fff;padding:12px 13px;font-weight:600;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent;opacity:.82}
nav button[aria-current=page]{border-bottom-color:var(--gold);opacity:1}
nav button:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}
main{max-width:720px;margin:0 auto;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));display:grid;gap:16px}
h2{font:700 21px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:13px;min-width:0}
.card h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin:0}
label.f{display:grid;gap:4px;font-weight:600;font-size:14px;min-width:0}
input[type=text],input[type=password],input[type=url],input[type=email],input[type=datetime-local],textarea,select{font:inherit;font-weight:400;width:100%;max-width:100%;padding:10px 11px;border:1px solid #b9ac98;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
.bool{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.bool input,.chk input{width:20px;height:20px;accent-color:var(--red)}
.chk{display:flex;gap:7px;align-items:center;font-weight:400}
.hint{font-size:13px;font-weight:400;color:var(--brown)}
button.b{font:inherit;font-weight:700;border:0;border-radius:9px;padding:11px 18px;background:var(--red);color:#fff;cursor:pointer}
button.b.plain{background:#fff;color:var(--red);border:1px solid var(--red)}
button.b.small{padding:6px 12px;font-size:14px}
button.b.danger{background:#fff;color:#a01515;border:1px solid #a01515}
button.b:disabled{opacity:.55;cursor:default}
button.out{all:unset;cursor:pointer;font-size:13px;text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.save{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;background:var(--navy);color:var(--cream);padding:10px 12px;border-radius:12px;box-shadow:0 4px 16px rgba(11,21,48,.28)}
.save .msg{flex:1;font-size:14px;min-width:0}
.save button.b{background:var(--gold);color:var(--navy)}
.msg.bad,.bad{color:#a01515}
.save .msg.bad{color:#ffc9c0}
.good{color:var(--ok)}
.notice{background:var(--cream);border:1px solid #e6cf97;border-radius:10px;padding:12px;font-size:14px}
.news{border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;gap:6px;min-width:0}
.news.off{opacity:.62}
.news b{overflow-wrap:anywhere}
.news p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--brown)}
.log{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;min-width:0;overflow-wrap:anywhere}
.log:last-child{border:0}
.sign{max-width:420px;margin:30px auto 0;width:100%}
.temp{font:600 18px/1.3 ui-monospace,Menlo,monospace;background:var(--cream);padding:10px;border-radius:8px;overflow-wrap:anywhere;user-select:all}
</style>
</head>
<body>
<header><h1>St. Mina App Portal</h1><span class="who" id="who"></span></header>
