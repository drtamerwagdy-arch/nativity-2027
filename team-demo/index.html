:root{--bar:#0B1530;--bar2:#1A2D57;--gold:#C8843A;--cream:#FFF3D6;--muted:#5B6477;--page:#F3F5F9;--ink:#0B1530;--line:#E3E8F0;--ok:#2E6B45;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.bar{background:#fff;color:var(--ink);border-bottom:4px solid var(--gold);box-shadow:0 2px 10px rgba(11,21,48,.06);padding:8px 16px 0;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.bar .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{margin:0;font:400 20px/1 "Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:1.5px;color:var(--ink)}
.pill{background:#C0392B;color:#fff;font:700 11px/1 system-ui,sans-serif;letter-spacing:1px;padding:4px 7px;border-radius:999px}
.note{color:#8E2226;font-weight:700;font-size:13px;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:400 17px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:1.2px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button:focus-visible,.reset:focus-visible,.mail:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tabs .count{display:inline-block;min-width:18px;margin-left:4px;padding:2px 5px;border-radius:9px;background:var(--gold);color:#fff;font:700 11px/1.2 system-ui,sans-serif}
.reset{margin-left:auto;background:transparent;border:1px solid var(--muted);color:var(--muted);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
main{flex:1;min-height:0;position:relative}
iframe.page{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--page)}
#outbox{position:absolute;inset:0;overflow:auto;padding:14px 16px 30px}
#outbox .wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.mail{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}

.mail span{color:#6F5E62;font-size:13px}
.mail.open{border-color:var(--bar2);box-shadow:0 0 0 1px var(--bar2)}
.viewer{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.viewer .head{padding:10px 12px;font-size:13px;color:#6F5E62;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.viewer iframe{width:100%;height:900px;border:0;display:block}

<script>/**
 * Sensitive.js — reads the text of a payment screenshot.
 * Shared, unchanged, by the buyer's phone (before upload) and the server (backstop).
 * No Google services and no DOM: plain functions only.
 *
 *   Proof.sensitive(text, expected) → [{type, label}]   anything personal/bank → reject the image
 *       (expected = the amount paid; any bigger dollar figure is treated as a balance)
 *   Proof.facts(text, ctx) → {recipient, amount, keyword, ref, date}   what the proof shows
 *   Proof.sensitiveLines(lines, expected) → [label or '' per line]   which lines to scramble on the phone (2026-09-25)
 */
var Proof = (function () {
  var ALLOWED_EMAILS = ['donations@stminacalgary.ca', 'artteam@stminacalgary.ca'];

  var RULES = [
    { type: 'account', label: 'an account or card number',
      re: /(?:[*•●·xX]{2,}\s?\d{3,4})|(?:\b(?:account|acct|chequing|checking|savings|card|transit|institution|compte|carte|visa|mastercard|debit)\b[^\n]{0,30}?\d[\d \-]{3,})/i },
    { type: 'card', label: 'a card number', re: /\b(?:\d[ \-]?){13,19}\b/ },
    { type: 'balance', label: 'your balance', re: /\b(?:balance|available (?:balance|funds)|solde|disponible)\b/i },
    // the account's name alone gives away which account paid: refuse it even when the digits are covered
    { type: 'acctname', label: 'your account name (chequing / savings)', re: /\b(?:chequing|checking|savings|from account|compte (?:ch[èe]ques|[ée]pargne)|tfsa|line of credit)\b/i },
    { type: 'sin', label: 'a SIN / ID number', re: /\b(?:SIN|social insurance)\b|\b\d{3}[ \-]\d{3}[ \-]\d{3}\b/i },
    { type: 'phone', label: 'a phone number', re: /(?:\+?1[ .\-]?)?\(?\b\d{3}\)?[ .\-]\d{3}[ .\-]\d{4}\b/ },
    { type: 'postal', label: 'a postal code / address', re: /\b[ABCEGHJ-NPRSTVXY]\d[ABCEGHJ-NPRSTV-Z][ \-]?\d[ABCEGHJ-NPRSTV-Z]\d\b/i },
    { type: 'address', label: 'a street address',
      // a house number (not the cents of an amount) + street type; "St. Mina" is the recipient, not a street
      re: /(?:^|[\s(])\d{1,5}\s+(?:[A-Za-z]+\s){1,3}(?:st(?!\.?\s*mina)|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|cres|crescent|way|lane|ln|court|ct|place|pl|trail|close|gate|heights|hts|circle|cir)\b\.?/im },
    { type: 'dob', label: 'a date of birth', re: /\b(?:date of birth|birth ?date|d\.?o\.?b\.?)\b/i },
    { type: 'security', label: 'a security question or answer', re: /\bsecurity (?:question|answer)\b|question de s[ée]curit[ée]/i }
  ];

  // Reference / confirmation numbers are proof, not personal data: blank them out before the digit rules run.
  var REF_RE = /\b(?:reference|ref|confirmation|conf|transaction id|tracking)\b\s*(?:number|no\.?|#|id)?\s*[:#]?\s*([A-Za-z0-9\-]{6,})/gi;

  function withoutRefs(text) { return String(text || '').replace(REF_RE, ' REF '); }

  function sensitive(text, expected) {
    var t = withoutRefs(text), found = [], seen = {};
    RULES.forEach(function (r) { if (!seen[r.type] && r.re.test(t)) { seen[r.type] = 1; found.push({ type: r.type, label: r.label }); } });
    var emails = t.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g) || [];
    if (emails.some(function (e) { return ALLOWED_EMAILS.indexOf(e.toLowerCase()) < 0; })) found.push({ type: 'email', label: 'your own email address' });
    // a card-number hit that is really just the account rule again reads badly twice
    if (seen.account && seen.card) found = found.filter(function (f) { return f.type !== 'card'; });
    if (seen.account && seen.acctname) found = found.filter(function (f) { return f.type !== 'acctname'; });
    var exp = Number(expected) || 0, paid = amountPaid(t);
    var ref = Math.max(exp, paid);
    if (!seen.balance && ref > 0 && amounts(t).some(function (a) { return a > ref + 0.009; }))
      found.push({ type: 'balance', label: 'another dollar amount (probably your balance)' });
    return found;
  }

  // The phone scrambles private details before a screenshot is sent (Tamer 2026-09-25: "say it will be scrambled … and actually
  // build a rule for it"): the same rules, line by line, so only the lines that hold something private are covered and who was
  // paid, the amount, the date, the message and the reference stay readable. A dollar figure above the amount paid is a balance.
  function sensitiveLines(lines, expected) {
    var joined = lines.join('\n'), all = withoutRefs(joined), ref = Math.max(Number(expected) || 0, amountPaid(all)), refs = [], m;
    REF_RE.lastIndex = 0;
    while ((m = REF_RE.exec(joined))) refs.push(m[1]);   // a reference on the line under its label is proof, not a card number
    return lines.map(function (line) {
      var t = withoutRefs(line), hit = '';
      refs.forEach(function (r) { t = t.split(r).join(' REF '); });
      RULES.some(function (r) { if (r.re.test(t)) { hit = r.label; return true; } return false; });
      if (!hit && (t.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g) || []).some(function (e) { return ALLOWED_EMAILS.indexOf(e.toLowerCase()) < 0; })) hit = 'your own email address';
      if (!hit && ref > 0 && amounts(t).some(function (a) { return a > ref + 0.009; })) hit = 'your balance';
      return hit;
    });
  }

  // ---- what the proof shows ----
  var KEYWORDS = ['wonderworker', 'wonderworkers', 'artteam', 'theartteam', 'nativity', 'nativitycelebration', 'nativity2027', 'stminanativity', 'ww27'];

  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) d[i] = [i];
    for (j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[m][n];
  }

  // Accepts "Wonder worker", "wonderworker", "WONDER-WORKER", "art team", "Nativity celebration", "wondr worker", a WW27 order code…
  function keyword(text) {
    var raw = String(text || '');
    if (/\bWW\s?-?\s?27\b|\bWW\b/i.test(raw)) return 'WW';
    var compact = raw.toLowerCase().replace(/[^a-z0-9]/g, '');
    for (var k = 0; k < KEYWORDS.length; k++) {
      var w = KEYWORDS[k], tol = w.length >= 10 ? 2 : (w.length >= 7 ? 1 : 0);
      if (compact.indexOf(w) > -1) return w;
      if (!tol) continue;
      for (var len = w.length - 1; len <= w.length + 1; len++)
        for (var i = 0; i + len <= compact.length; i++)
          if (lev(compact.substr(i, len), w) <= tol) return w;
    }
    return '';
  }

  function amounts(text) {
    var out = [], re = /\$\s?(\d{1,3}(?:,\d{3})*(?:\.\d{2})?|\d+(?:\.\d{2})?)/g, m;
    while ((m = re.exec(String(text || '')))) out.push(Number(m[1].replace(/,/g, '')));
    return out;
  }

  // the figure on the "Amount" line, else the largest figure shown
  function amountPaid(text) {
    var m = String(text || '').match(/\bamount\b[^$\d]{0,25}\$\s?(\d{1,3}(?:,\d{3})*(?:\.\d{2})?|\d+(?:\.\d{2})?)/i);
    if (m) return Number(m[1].replace(/,/g, ''));
    return 0;
  }

  function facts(text) {
    var t = String(text || ''), refs = [], m;
    REF_RE.lastIndex = 0;
    while ((m = REF_RE.exec(t))) refs.push(m[1]);
    var am = amounts(t), paid = amountPaid(t);
    var date = (t.match(/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s+20\d\d\b|\b20\d\d[\-\/]\d{2}[\-\/]\d{2}\b/i) || [''])[0];
    return {
      recipient: /donations\s*@\s*stminacalgary\s*\.\s*ca/i.test(t) || /st\.?\s*mina\s+donation/i.test(t),
      amount: paid || (am.length ? Math.max.apply(null, am) : 0),
      keyword: keyword(t),
      ref: refs[0] || '',
      date: date
    };
  }

  return { sensitive: sensitive, sensitiveLines: sensitiveLines, facts: facts, keyword: keyword, amounts: amounts };
})();
if (typeof module !== 'undefined') module.exports = Proof;
</script>

//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

  function person(p) {

    var o = { first: str(p.first), last: str(p.last), email: str(p.email).toLowerCase(), phone: str(p.phone),

  // Every public form carries a code the page got from us (signed time). No code, a forged code,
  // or a form sent back faster than a person could fill it → refused. Stops scripts posting straight at the engine.
  // Least donation for an order (Tamer 2026-09-24): own tickets by the table, then suggested × n; gifted seats suggested each on top.
  // The team page has no minimum.
  function minimumFor(s, qty, gq) {
    var t = String(s.min_table).split(/[\s,]+/).map(Number).filter(function (n) { return n > 0; });
    var own = qty <= t.length ? t[qty - 1] : num(s.suggested) * qty;
    return Math.max(own, 0) + num(s.suggested) * gq;

    if (!ts || parts[1] !== env.sign(parts[0])) throw err('Please reload the page and try again.');

    if (age > 6 * 3600e3) throw err('This page was open a long time. Please reload it and try again.');

  // ---------- public: Get tickets (online order, e-Transfer or cheque, with proof) ----------
  function order(env, p) {
    var prev = findBySubmit(env, p.submit_id);
    if (prev) return prev.kind === 'booking' ? bookingOutcome(env, prev) : prev.method === 'Card' ? cardAgain(env, prev) : outcome(prev, { status: prev.proof_status });
    antiSpam(env, p);
    var s = settings(env), who = person(p);
    if (!salesOpen(env, s)) throw err('Ticket sales are closed.');
    var qty = Math.floor(num(p.qty)), gq = Math.floor(num(p.gift_qty)), amount = num(p.amount);
    if (qty < 1 || qty > num(s.order_max)) throw err('Please choose between 1 and ' + num(s.order_max) + ' tickets.');
    if (gq < 0 || gq > num(s.order_max)) throw err('Gift seats: 0 to ' + num(s.order_max) + '.');
    if (!(amount > 0)) throw err('Please enter your donation amount.');

    if (amount + 0.001 < least) throw err('The minimum donation for ' + qty + ' ticket' + (qty > 1 ? 's' : '') + (gq ? ' and ' + gq + ' gifted seat' + (gq > 1 ? 's' : '') : '') + ' is ' + money(least) + '.');

      if (qty > num(s.booking_max)) throw err('Pay-in-cash bookings are up to ' + num(s.booking_max) + ' tickets. For more, please pay by e-Transfer or ask a team member.');
      var open = pendingHolds(env, s).filter(function (e) { return e.email === who.email; })[0];
      if (open) throw err('You already have a booking (' + open.order_code + ') waiting for payment. Please pay that one first. The code is in your email.');
      return book(env, s, who, qty, gq, amount, p);

  // ---------- card payments through Square (Tamer 2026-09-25: online, the buyer pays the fee, shown as a hint) ----------
  // Off until the church's Square account is connected (tools/square_setup.py) and square_on is 'Y'. Submit makes a Square payment
  // page for exactly this order: the donation plus Square's fee (2.8% + 30¢, grossed up so the church receives the full donation).
  // The entry waits as "awaiting_card" (no tickets, not counted anywhere) until Square itself says the order is paid: when the buyer
  // comes back (card_status), when Square calls (square_event) or from the dashboard (owner_card_check). Never on the buyer's word.
  function squareOn(env, s) { return String(s.square_on).toUpperCase() === 'Y' && !!str(s.square_location_id) && !!env.square && env.squareReady(); }
  function cardTotal(s, amount) { var pct = num(s.square_fee_pct) / 100, fix = num(s.square_fee_fixed); return Math.ceil((amount + fix) / (1 - pct) * 100) / 100; }
  function cardStart(env, s, who, p, fields, what, page) {
    if (!squareOn(env, s)) throw err('Card payments are not available right now. Please pay by e-Transfer.');
    return env.lock(function () {
      var again = findBySubmit(env, p.submit_id); if (again) return cardAgain(env, again);
      if (typeof fields !== 'function' && fields.kind === 'order' && !fits(env, s, fields.qty, fields.gift_qty)) throw err('Sorry, only ' + Math.max(0, seatsLeft(env, s)) + ' seats are left. You can join the waitlist.');
      // Tamer 2026-09-25 (layout D): covering the fee is an optional tick (cover_fee Y/N), a gift rather than a surcharge, which
      // Square doesn't support in Canada. An older page that sends nothing had the fee added, so no answer means Y.
      var cover = !/^(n|no|false|0)$/i.test(str(p.cover_fee));
      var code = orderCode(env, s), token = env.random(20), f = typeof fields === 'function' ? fields(code) : fields, total = cover ? cardTotal(s, f.amount) : num(f.amount);
      var back = str(s.site_url || 'https://thewonderworker.ca/') + page + '?card=' + encodeURIComponent(code) + '&t=' + token;
      var r = env.square('POST', '/v2/online-checkout/payment-links', { idempotency_key: code + '-' + token,
        // Square's page and receipt show the split: "… · $40.00 donation + $1.47 to cover the card fee"
        quick_pay: { name: 'Nativity Celebration 2027 · ' + what + ' · ' + code + (total > num(f.amount) ? ' · ' + money(f.amount) + ' donation + ' + money(total - num(f.amount)) + ' to cover the card fee' : ''),
          price_money: { amount: Math.round(total * 100), currency: 'CAD' }, location_id: str(s.square_location_id) },
        checkout_options: { redirect_url: back, ask_for_shipping_address: false }, pre_populated_data: { buyer_email: who.email },
        payment_note: code + ' · ' + str(who.first + ' ' + who.last) });
      var link = r.payment_link || {}, o = { method: 'Card', order_code: code, submit_id: str(p.submit_id), token: token, card_fee: Math.round((total - f.amount) * 100) / 100,
        card_ref: link.order_id, card_link: link.url };
      for (var k in f) o[k] = f[k];
      var e = mk(env, who, o); e.status = 'awaiting_card';
      env.append('entries', e);
      return { ok: true, card: { url: link.url }, order: code };
    });
  }
  function cardAgain(env, e) { return e.status === 'awaiting_card' ? { ok: true, card: { url: e.card_link }, order: e.order_code } : cardOutcome(env, e); }
  function cardOutcome(env, e) {
    var s = settings(env);
    if (e.kind === 'donation') return outcome(e, null, { kind: 'donation', raised: raised(env), goal: num(s.goal) });
    if (e.kind === 'sponsor') return outcome(e, { status: 'ok' }, { kind: 'sponsor', business: e.business || str(e.first + ' ' + e.last), silent: e.silent === 'Y' });
    return outcome(e, { status: 'ok' }, { kind: 'order' });
  }
  function cardPaid(env, e) {   // Square's own answer: the order is paid in full
    var o = ((env.square('GET', '/v2/orders/' + encodeURIComponent(e.card_ref)) || {}).order) || {};
    var due = o.net_amount_due_money ? num(o.net_amount_due_money.amount) : -1, paidCents = o.total_money ? num(o.total_money.amount) : 0;
    return (o.state === 'COMPLETED' || (o.tenders && o.tenders.length > 0 && due === 0)) && paidCents >= Math.round((num(e.amount) + num(e.card_fee)) * 100);
  }
  function cardSettle(env, e0) {
    if (!e0 || e0.status !== 'awaiting_card' || !e0.card_ref || !cardPaid(env, e0)) return e0;
    return env.lock(function () {
      var s = settings(env);   // inside the lock: the ticket counters as they are now
      var e = env.list('entries').filter(function (x) { return x.id === e0.id; })[0];
      if (!e || e.status !== 'awaiting_card') return e;   // settled meanwhile (the buyer came back while Square called)
      // Only once per order, whatever the sheet shows. 2026-09-25: WW27-0003 was settled twice in the same second (the buyer's
      // return and Square's notice) and got two tickets emails with different numbers; the sheet had not shown the first yet.
      // The mark lives in the script's own store, which never lags.
      if (env.once && !env.once('card-settled-' + e.id)) { e.settling = true; return e; }
      var reasons = [], patch = { status: 'ok', proof_status: 'card' };
      if (e.kind === 'order') {
        if (fits(env, s, num(e.qty), num(e.gift_qty))) { patch.tickets = take(env, s, num(e.qty)).join(', '); patch.gift_numbers = num(e.gift_qty) ? takeGift(env, s, num(e.gift_qty)).join(', ') : ''; }
        else { patch.status = 'flagged'; reasons.push('paid by card, but the seats ran out before Square confirmed: please refund in Square or find seats'); }
      }
      env.update('entries', e.id, patch); for (var k in patch) e[k] = patch[k];
      if (e.kind === 'order') {
        if (e.tickets) finishSale(env, s, e, 'Thank you for your donation of <b>' + money(e.amount) + '</b>. Your tickets are below.', reasons, 'card order ' + e.order_code);
        else teamAlert(env, s, e, reasons, 'card order ' + e.order_code);

  }
  // the buyer is back from Square's page (?card=WW27-0005&t=…): settle it if Square says it is paid
  function cardStatus(env, p) {
    var e = env.list('entries').filter(function (x) { return x.method === 'Card' && x.order_code === str(p.order); })[0];

    [].forEach.call(box.querySelectorAll('[data-no]'), function (b) { b.onclick = function () { var n = Number(b.getAttribute('data-no')); openNo = openNo === n ? null : n; renderOutbox(); }; });
    [].forEach.call(box.querySelectorAll('iframe[data-mail]'), function (f) {
      var m = db.outbox.filter(function (x) { return x.no === Number(f.getAttribute('data-mail')); })[0], html = m.html;
      for (var cid in m.inline) html = html.split('cid:' + cid).join(m.inline[cid]);
      f.srcdoc = '<meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank">' + html;
      f.onload = function () { try { f.style.height = (f.contentDocument.body.scrollHeight + 20) + 'px'; } catch (e) { } };
    });
    [].forEach.call(box.querySelectorAll('[data-openbooking]'), function (b) {
      b.onclick = function () {
        var code = b.getAttribute('data-openbooking'), e = db.entries.filter(function (x) { return x.order_code === code; })[0];
        show('team', { b: code + '.' + (e ? e.token : '') });
      };
    });
  }
  var tt = null;
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3500); }
  document.getElementById('reset').onclick = function () { try { localStorage.removeItem(KEY_STORE); } catch (e) { } fresh(); openNo = null; count(); cache = {}; show('index'); toast('Demo reset: back to the starting examples.'); };
  count(); show('index');
})();
</script>
